name: Release to GitHub and push tag

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "SemVer scope of the release"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  create-github-release-push-tag:
    uses: bakdata/ci-templates/.github/workflows/python-uv-release.yaml@6a97ae255090bdd725bfbb21d0eb05d46a9abd59 # https://github.com/bakdata/ci-templates/releases/tag/1.83.0
    name: Release
    with:
      release-type: ${{ inputs.release-type }}
      python-version: ${{ vars.PYTHON_VERSION }}
      uv-version: ${{ vars.UV_VERSION }}
      changelog: true
      changelog-file: "./docs/docs/user/changelog.md"
    secrets:
      github-username: "${{ secrets.GH_USERNAME }}"
      github-email: "${{ secrets.GH_EMAIL }}"
      github-token: "${{ secrets.GH_TOKEN }}"

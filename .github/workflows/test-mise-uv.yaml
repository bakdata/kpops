name: test-mise-uv (temporary)
on:
  push:
    paths: [".github/workflows/test-mise-uv.yaml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: uv
      - name: uv after mise
        run: |
          echo "pinned: $(mise current uv)"
          which -a uv; uv --version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        id: setup-uv
        with:
          enable-cache: true
          python-version: "3.14"
      - name: uv after setup-uv
        run: |
          echo "setup-uv reported: ${{ steps.setup-uv.outputs.uv-version }} at ${{ steps.setup-uv.outputs.uv-path }}"
          which -a uv; uv --version
          test "$(uv --version | cut -d' ' -f2)" = "$(mise current uv)" || { echo "::error::DRIFT: uv differs from mise pin"; exit 1; }
      - run: uv sync --frozen

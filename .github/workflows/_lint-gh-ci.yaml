name: Lint GitHub CI

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/**
      - actions/**

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Lint actions and workflows
        uses: bakdata/ci-templates/actions/action-lint@37079c092c50f7e75c206269b4388bf79f2a7a72 # https://github.com/bakdata/ci-templates/releases/tag/2.1.1
        with:
          action-lint-version: "v1.7.6"

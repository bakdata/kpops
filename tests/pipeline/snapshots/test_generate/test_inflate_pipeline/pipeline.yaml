        memory: 2G
      limits:
        memory: 2G
    commandLine:
      CONVERT_XML: true
    autoscaling:
      enabled: true
      lagThreshold: 10000
      maxReplicas: 1
    statefulSet: false
  helm_release_name: resources-pipeline-with-inflate-converter
  helm_name_override: resources-pipeline-with-inflate-converter
- type: should-inflate

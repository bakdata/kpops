- type: converter
  name: converter
  prefix: resources-pipeline-with-inflate-
  enabled: true
  to:
    topics:
      resources-pipeline-with-inflate-converter:
        type: output
        partitions_count: 50
        configs:
          cleanup.policy: compact,delete
          retention.ms: '-1'

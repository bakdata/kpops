[tools]
dprint = "0.63.0"
hk = "2.8.0"

[hooks]
postinstall = "hk install --mise"

[settings]
experimental = true
python.uv_venv_auto = "source"

[deps.uv]
auto = true

[tasks.serve-docs]
description = "Serve docs"
usage = 'arg "[port]" default="8000"'
run = "uv run --frozen --group=docs zensical serve --config-file docs/mkdocs.yml --dev-addr localhost:${usage_port}"
dir = "{{config_root}}"
